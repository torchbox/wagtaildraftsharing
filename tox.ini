[tox]
skipsdist=True

# Compatibility summary (retrieved 2026-05-14):
#
# Python vs Django
# ----------------
# Python 3.10   → Django 4.2, 5.1, 5.2
# Python 3.11   → Django 4.2, 5.1, 5.2
# Python 3.12   → Django 4.2, 5.1, 5.2, 6.0
# Python 3.13   → Django 5.1, 5.2, 6.0
# Python 3.14   → Django 5.2, 6.0
#
# Django vs Wagtail
# -----------------
# Django 4.2 → Wagtail 7.0, 7.3
# Django 5.1 → Wagtail 7.0
# Django 5.2 → Wagtail 7.0, 7.3, 7.4
# Django 6.0 → Wagtail 7.3, 7.4

envlist =
    lint,
    python3.10-django4.2-wagtail{7.0,7.3},
    python3.10-django5.1-wagtail7.0,
    python3.10-django5.2-wagtail{7.0,7.3,7.4},
    python3.11-django4.2-wagtail{7.0,7.3},
    python3.11-django5.1-wagtail7.0,
    python3.11-django5.2-wagtail{7.0,7.3,7.4},
    python3.12-django4.2-wagtail{7.0,7.3},
    python3.12-django5.1-wagtail7.0,
    python3.12-django5.2-wagtail{7.0,7.3,7.4},
    python3.12-django6.0-wagtail{7.3,7.4},
    python3.13-django5.1-wagtail7.0,
    python3.13-django5.2-wagtail{7.0,7.3,7.4},
    python3.13-django6.0-wagtail{7.3,7.4},
    python3.14-django5.2-wagtail{7.3,7.4},
    python3.14-django6.0-wagtail{7.3,7.4},
    coverage

[testenv]
install_command=pip install -e ".[testing]" -U {opts} {packages}

commands=
    python -b -m coverage run --parallel-mode --source='wagtaildraftsharing' {toxinidir}/testmanage.py test {posargs}

passenv = PYTHONBREAKPOINT

basepython=
    python3.10: python3.10
    python3.11: python3.11
    python3.12: python3.12
    python3.13: python3.13
    python3.14: python3.14

deps=
    django4.2: django>=4.2,<4.3
    django5.1: django>=5.1,<5.2
    django5.2: django>=5.2,<5.3
    django6.0: django>=6.0,<6.1
    wagtail7.0: wagtail>=7.0,<7.1
    wagtail7.3: wagtail>=7.3,<7.4
    wagtail7.4: wagtail>=7.4,<7.5

[testenv:lint]
basepython=python3.12
deps=
    ruff
commands=
    ruff check wagtaildraftsharing testmanage.py

[testenv:coverage]
basepython=python3.12
deps=
    coverage[toml]
    wagtail-factories
    freezegun>=1.5,<2
commands=
    coverage combine
    coverage report -m
    coverage xml

[testenv:interactive]
basepython=python3.12
deps=
    wagtail>=7.4,<7.5

commands_pre=
    python {toxinidir}/testmanage.py makemigrations
    python {toxinidir}/testmanage.py migrate
    python {toxinidir}/testmanage.py shell -c "from django.contrib.auth.models import User;(not User.objects.filter(username='admin').exists()) and User.objects.create_superuser('admin', 'super@example.com', 'changeme')"

commands=
    {posargs:python testmanage.py runserver 0.0.0.0:8000}

setenv=
    INTERACTIVE=1

[gh-actions]
# Running tox in GHA without redefining it all in a GHA matrix:
# https://github.com/ymyzk/tox-gh-actions
python =
    3.10: python3.10
    3.11: python3.11
    3.12: python3.12, lint, coverage
    3.13: python3.13
    3.14: python3.14
